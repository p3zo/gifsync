<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>gifsync beat marker</title>
<style>
:root {
  --bg: #ffffff; --panel: #f4f4f5; --line: #d9d9de; --ink: #18181b;
  --dim: #6b6b76; --accent: #d6336c; --accent-ink: #ffffff; --ok: #1a7f4b;
  --grid: #0f766e; --loop: #c2410c;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #131316; --panel: #1c1c21; --line: #33333c; --ink: #ececf0;
    --dim: #9a9aa6; --accent: #f06595; --accent-ink: #1a1a1f; --ok: #4ade80;
    --grid: #2dd4bf; --loop: #fb923c;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; padding: 0 1.25rem 4rem; background: var(--bg); color: var(--ink);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
}
header {
  display: flex; align-items: baseline; gap: .75rem; flex-wrap: wrap;
  max-width: 68rem; margin: 0 auto; padding: 1.5rem 0 1rem;
}
h1 { font-size: 1.15rem; margin: 0; letter-spacing: -.01em; }
h2 { font-size: .8rem; margin: 0 0 .75rem; text-transform: uppercase; letter-spacing: .07em; color: var(--dim); }
main { max-width: 68rem; margin: 0 auto; display: grid; gap: 1rem; }
section {
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 1rem;
  min-width: 0; /* let the filmstrip scroll rather than stretching the page */
}
section[data-off] { opacity: .45; pointer-events: none; }
.row { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; }
.row + .row { margin-top: .75rem; }
button {
  font: inherit; font-size: .875rem; padding: .35rem .7rem; border-radius: 6px;
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer;
}
button:hover:not(:disabled) { border-color: var(--dim); }
button:disabled { opacity: .4; cursor: default; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 600; }
label { display: inline-flex; align-items: center; gap: .4rem; font-size: .875rem; }
input[type=number], select { font: inherit; font-size: .875rem; padding: .3rem .4rem;
  border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); }
input[type=number] { width: 6rem; }
.key { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: middle; }
.k-mark { background: var(--accent); } .k-grid { background: var(--grid); } .k-loop { background: var(--loop); }
.drop {
  border: 1.5px dashed var(--line); border-radius: 8px; padding: 1.75rem 1rem; text-align: center;
  color: var(--dim); cursor: pointer; font-size: .9rem;
}
.drop.over { border-color: var(--accent); color: var(--ink); }
#frameCanvas, #previewCanvas {
  display: block; max-width: 100%; max-height: 340px; width: auto; image-rendering: pixelated;
  background: repeating-conic-gradient(var(--line) 0 25%, transparent 0 50%) 0 0/16px 16px;
  border-radius: 6px; margin-bottom: .75rem;
}
#strip { display: flex; gap: 3px; overflow-x: auto; padding: .5rem 0; margin-top: .75rem; }
#strip canvas {
  height: 54px; flex: none; border-radius: 3px; cursor: pointer;
  border: 2px solid transparent; background: var(--bg);
}
#strip canvas.cur { border-color: var(--ink); }
#strip canvas.beat { border-color: var(--accent); }
#strip canvas.cur.beat { outline: 2px solid var(--ink); outline-offset: 1px; }
#wave { display: block; width: 100%; height: 110px; cursor: crosshair; border-radius: 6px; background: var(--bg); }
.mono { font-family: var(--mono); font-size: .8rem; color: var(--dim); }
.mono b { color: var(--ink); font-weight: 600; }
.warn { color: var(--accent); }
#log {
  font-family: var(--mono); font-size: .75rem; white-space: pre-wrap; word-break: break-word;
  max-height: 15rem; overflow-y: auto; margin: .75rem 0 0; padding: .6rem;
  background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
}
#log:empty { display: none; }
a#download { display: inline-block; margin-top: .75rem; color: var(--accent); font-weight: 600; }
a#download[hidden] { display: none; }
#unsupported { border-color: var(--accent); }
</style>
</head>
<body>

<header>
  <h1>gifsync beat marker</h1>
</header>

<main>

<section id="unsupported" hidden>
  <h2>Unsupported browser</h2>
  <div class="mono" id="unsupportedWhy"></div>
</section>

<section id="secGif">
  <h2>GIF</h2>
  <div class="drop" id="gifDrop">Drop a GIF, or click to choose</div>
  <input type="file" id="gifInput" accept="image/gif" hidden>
  <div id="gifBody" hidden>
    <canvas id="frameCanvas"></canvas>
    <div class="row">
      <button id="prevBtn">&#9664;</button>
      <button id="nextBtn">&#9654;</button>
      <button id="markBtn" class="primary">Mark beat (space)</button>
      <button id="clearBtn">Clear marks</button>
      <span class="mono" id="framePos"></span>
    </div>
    <div id="strip"></div>
    <div class="mono" id="beatList"></div>
  </div>
</section>

<section id="secAudio">
  <h2>Song</h2>
  <div class="drop" id="audioDrop">Drop an audio file, or click to choose</div>
  <input type="file" id="audioInput" accept="audio/*" hidden>
  <div id="audioBody" hidden>
    <canvas id="wave"></canvas>
    <div class="row">
      <button id="tapBeatBtn">Tap a beat (B)</button>
      <button id="clearBeatsBtn">Clear beat marks</button>
      <span class="mono" id="audioSummary"></span>
    </div>
    <div class="row"><span class="mono">
      <span class="key k-mark"></span> beats you marked in the song
      &nbsp; <span class="key k-grid"></span> where the gif's beat frames land
      &nbsp; <span class="key k-loop"></span> where the gif's loop restarts
    </span></div>
  </div>
</section>

<section id="secSync" data-off>
  <h2>Sync</h2>
  <canvas id="previewCanvas"></canvas>
  <div class="row">
    <button id="previewBtn" class="primary">Play preview</button>
    <span class="mono" id="previewPos"></span>
  </div>
  <div class="row">
    <label>BPM <input type="number" id="bpm" step="0.1" min="1" value="120"></label>
    <button id="tapBtn">Tap</button>
    <button id="estimateBtn">Estimate</button>
    <span class="mono" id="estimateNote"></span>
    <label>Animation hits
      <select id="hits">
        <option value="0.25">every 4 beats</option>
        <option value="0.5">every 2 beats</option>
        <option value="1" selected>every beat</option>
        <option value="2">twice a beat</option>
        <option value="4">four times a beat</option>
      </select>
    </label>
    <label>Easing
      <select id="interpolation">
        <option value="linear">linear</option>
        <option value="quadratic">quadratic</option>
        <option value="cubic">cubic</option>
      </select>
    </label>
    <label><input type="checkbox" id="clickTrack"> Click track</label>
  </div>
  <div class="row"><span class="mono" id="timingSummary"></span></div>
</section>

<section id="secRender" data-off>
  <h2>Render</h2>
  <div class="row">
    <button id="renderBrowserBtn" class="primary">Render</button>
  </div>
  <div class="row"><span class="mono warn" id="codecNote"></span></div>
  <pre id="log"></pre>
  <a id="download" hidden>Download</a>
</section>

</main>

<script type="module">
"use strict";

const $ = (id) => document.getElementById(id);

/* --- timing:start --- pinned by docs/test_timing.mjs against timing_cases.json --- */

// Frame timestamps are written to the microsecond, so nothing here is rounded. What a
// viewer cannot see is a frame held for less than one refresh of their display.
export const MIN_VISIBLE_MS = 1000 / 60;

const EASINGS = {
  linear: (t) => t,
  quadratic: (t) => (t < 0.5 ? 2 * t * t : -2 * t * t + 4 * t - 1),
  cubic: (t) => {
    if (t < 0.5) return 4 * t * t * t;
    const p = 2 * t - 2;
    return 0.5 * p * p * p + 1;
  },
};

export function getDurations(beatFrames, msPerBeat, nFrames, interpolation = "linear") {
  const ease = EASINGS[interpolation];
  if (!ease) throw new Error(`interpolation=${interpolation} not supported`);

  if (!beatFrames.length) throw new Error("At least one beat frame is required.");

  const tidy = [...new Set(beatFrames)].sort((a, b) => a - b);
  if (beatFrames.length !== tidy.length || beatFrames.some((f, i) => f !== tidy[i])) {
    throw new Error(`Beat frames must be sorted and unique, got ${beatFrames}.`);
  }

  if (beatFrames[0] < 0 || beatFrames[beatFrames.length - 1] >= nFrames) {
    throw new Error(`Beat frames must be within [0, ${nFrames - 1}], got ${beatFrames}.`);
  }

  const durations = [];

  beatFrames.forEach((frame, ix) => {
    const nextFrame = ix < beatFrames.length - 1 ? beatFrames[ix + 1] : nFrames + beatFrames[0];
    const n = nextFrame - frame;

    const times = [];
    for (let x = 0; x <= n; x++) times.push(msPerBeat * ease(x / n));
    for (let i = 1; i <= n; i++) durations.push(times[i] - times[i - 1]);
  });

  return durations;
}

export function getFrameOrder(firstBeatFrame, nFrames) {
  return Array.from({ length: nFrames }, (_, i) => (firstBeatFrame + i) % nFrames);
}

/* --- timing:end --- */

const state = {
  gifFile: null, frames: [], width: 0, height: 0, cur: 0, beats: new Set(),
  audioFile: null, audioBuffer: null, audioBeats: [], peaks: null,
};

/* ---------------------------------------------------------------- capabilities */

const MISSING = [
  ["ImageDecoder", "stepping through GIF frames"],
  ["VideoEncoder", "rendering the video"],
  ["AudioEncoder", "rendering the audio"],
].filter(([api]) => !(api in window));

if (MISSING.length) {
  $("unsupported").hidden = false;
  $("unsupportedWhy").textContent =
    MISSING.map(([api, what]) => `${api} is missing, so ${what} will not work.`).join("\n") +
    "\nTry a recent Chrome, Edge, or Safari.";
}

/* ------------------------------------------------------------------------ gif */

function wireDrop(dropId, inputId, onFile) {
  const drop = $(dropId), input = $(inputId);
  drop.onclick = () => input.click();
  input.onchange = () => input.files[0] && onFile(input.files[0]);
  drop.ondragover = (e) => { e.preventDefault(); drop.classList.add("over"); };
  drop.ondragleave = () => drop.classList.remove("over");
  drop.ondrop = (e) => {
    e.preventDefault();
    drop.classList.remove("over");
    if (e.dataTransfer.files[0]) onFile(e.dataTransfer.files[0]);
  };
}

async function loadGif(file) {
  $("gifDrop").textContent = `Decoding ${file.name}…`;

  const decoder = new ImageDecoder({ data: await file.arrayBuffer(), type: "image/gif" });
  await decoder.tracks.ready;
  // frameCount only settles once the whole gif has been parsed
  await decoder.completed;

  const count = decoder.tracks.selectedTrack.frameCount;
  const frames = [];
  for (let i = 0; i < count; i++) {
    const { image } = await decoder.decode({ frameIndex: i });
    frames.push(await createImageBitmap(image));
    image.close();
  }
  decoder.close();

  if (!frames.length) throw new Error(`No frames decoded from ${file.name}.`);

  state.gifFile = file;
  state.frames = frames;
  state.width = frames[0].width;
  state.height = frames[0].height;
  state.cur = 0;
  state.beats = new Set();

  $("gifDrop").textContent = `${file.name} — ${count} frames, ${state.width}×${state.height}. Drop another to replace.`;
  $("gifBody").hidden = false;

  const canvas = $("frameCanvas");
  canvas.width = state.width;
  canvas.height = state.height;
  $("previewCanvas").width = state.width;
  $("previewCanvas").height = state.height;

  buildStrip();
  drawFrame();
  refresh();
}

function buildStrip() {
  const strip = $("strip");
  strip.replaceChildren();
  state.frames.forEach((bmp, i) => {
    const h = 54, w = Math.max(1, Math.round((bmp.width / bmp.height) * h));
    const c = document.createElement("canvas");
    c.width = w; c.height = h;
    c.title = `frame ${i}`;
    c.getContext("2d").drawImage(bmp, 0, 0, w, h);
    c.onclick = () => { state.cur = i; drawFrame(); refresh(); };
    strip.append(c);
  });
}

function drawFrame() {
  for (const id of ["frameCanvas", "previewCanvas"]) {
    // The preview canvas tracks the selected frame while it is idle, so it is never blank
    if (id === "previewCanvas" && playback) continue;
    const ctx = $(id).getContext("2d");
    ctx.clearRect(0, 0, state.width, state.height);
    ctx.drawImage(state.frames[state.cur], 0, 0);
  }
}

function step(delta) {
  if (!state.frames.length) return;
  state.cur = (state.cur + delta + state.frames.length) % state.frames.length;
  drawFrame();
  refresh();
  $("strip").children[state.cur]?.scrollIntoView({ block: "nearest", inline: "center" });
}

function toggleMark() {
  if (!state.frames.length) return;
  state.beats.has(state.cur) ? state.beats.delete(state.cur) : state.beats.add(state.cur);
  refresh();
}

wireDrop("gifDrop", "gifInput", (f) => loadGif(f).catch(fail));
$("prevBtn").onclick = () => step(-1);
$("nextBtn").onclick = () => step(1);
$("markBtn").onclick = toggleMark;
$("clearBtn").onclick = () => { state.beats.clear(); refresh(); };

addEventListener("keydown", (e) => {
  if (e.target.matches("input, select, textarea")) return;
  if (e.key === "ArrowLeft") { step(-1); e.preventDefault(); }
  else if (e.key === "ArrowRight") { step(1); e.preventDefault(); }
  else if (e.key === " ") { toggleMark(); e.preventDefault(); }
  else if (e.key === "b" || e.key === "B") { tapBeat(); e.preventDefault(); }
});

/* ---------------------------------------------------------------------- audio */

// Pin the rate: Opus only encodes at 48kHz, and this makes decodeAudioData hand us
// buffers at that rate whatever the output device happens to run at
const actx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 48000 });

async function loadAudio(file) {
  $("audioDrop").textContent = `Decoding ${file.name}…`;

  const bytes = await file.arrayBuffer();
  state.audioBuffer = await actx.decodeAudioData(bytes.slice(0));
  state.audioFile = file;
  state.audioBeats = [];
  state.peaks = null;

  $("audioDrop").textContent =
    `${file.name} — ${state.audioBuffer.duration.toFixed(2)}s. Drop another to replace.`;
  $("audioBody").hidden = false;

  refresh();
}

// The first beat mark is the downbeat: the moment the animation starts from
function downbeat() {
  return state.audioBeats.length ? state.audioBeats[0] : 0;
}

function computePeaks(width) {
  const data = state.audioBuffer.getChannelData(0);
  const per = Math.max(1, Math.floor(data.length / width));
  const peaks = new Float32Array(width);
  for (let x = 0; x < width; x++) {
    let peak = 0;
    for (let i = x * per; i < Math.min((x + 1) * per, data.length); i++) {
      const v = Math.abs(data[i]);
      if (v > peak) peak = v;
    }
    peaks[x] = peak;
  }
  return peaks;
}

function drawWave(playheadSeconds = null) {
  const canvas = $("wave");
  const w = Math.round(canvas.clientWidth || 800), h = 110;

  if (canvas.width !== Math.round(w * devicePixelRatio)) {
    canvas.width = Math.round(w * devicePixelRatio);
    canvas.height = Math.round(h * devicePixelRatio);
    state.peaks = null;
  }
  if (!state.peaks || state.peaks.length !== w) state.peaks = computePeaks(w);

  const ctx = canvas.getContext("2d");
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  ctx.clearRect(0, 0, w, h);

  const duration = state.audioBuffer.duration;
  const at = (t) => Math.round((t / duration) * w) + 0.5;
  const css = getComputedStyle(document.body);

  ctx.fillStyle = css.getPropertyValue("--dim");
  for (let x = 0; x < w; x++) {
    const bar = Math.max(1, state.peaks[x] * h * 0.9);
    ctx.fillRect(x, (h - bar) / 2, 1, bar);
  }

  // Where each beat frame of the animation will land, and where the loop starts over.
  // Batched into two paths because a fast setting puts a couple of thousand lines here.
  if (currentTiming) {
    const step = currentTiming.msPerBeat / 1000;
    const grid = new Path2D(), loop = new Path2D();
    for (let k = 0; ; k++) {
      const t = downbeat() + k * step;
      if (t >= duration) break;
      const path = k % currentTiming.beats.length === 0 ? loop : grid;
      path.moveTo(at(t), k % currentTiming.beats.length === 0 ? 0 : h * 0.62);
      path.lineTo(at(t), h);
    }
    ctx.lineWidth = 1;
    ctx.strokeStyle = css.getPropertyValue("--grid");
    ctx.stroke(grid);
    ctx.strokeStyle = css.getPropertyValue("--loop");
    ctx.stroke(loop);
  }

  ctx.strokeStyle = css.getPropertyValue("--accent");
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (const t of state.audioBeats) { ctx.moveTo(at(t), 0); ctx.lineTo(at(t), h * 0.4); }
  ctx.stroke();

  if (playheadSeconds !== null) {
    ctx.strokeStyle = css.getPropertyValue("--ink");
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(at(playheadSeconds), 0);
    ctx.lineTo(at(playheadSeconds), h);
    ctx.stroke();
  }
}

$("wave").onclick = (e) => {
  const box = e.currentTarget.getBoundingClientRect();
  const duration = state.audioBuffer.duration;
  const t = Math.max(0, Math.min(duration, ((e.clientX - box.left) / box.width) * duration));

  // Clicking an existing mark takes it away again
  const tolerance = (8 / box.width) * duration;
  const near = state.audioBeats.findIndex((b) => Math.abs(b - t) < tolerance);
  if (near >= 0) {
    state.audioBeats.splice(near, 1);
    setTempoFromBeats();
    refresh();
  } else {
    addAudioBeat(t);
  }
};

function addAudioBeat(seconds) {
  state.audioBeats.push(seconds);
  state.audioBeats.sort((a, b) => a - b);
  setTempoFromBeats();
  refresh();
}

// Two or more marks give the tempo, on the assumption they are consecutive beats
function setTempoFromBeats() {
  if (state.audioBeats.length < 2) return;
  const span = state.audioBeats[state.audioBeats.length - 1] - state.audioBeats[0];
  $("bpm").value = (60 / (span / (state.audioBeats.length - 1))).toFixed(1);
}

$("clearBeatsBtn").onclick = () => { state.audioBeats = []; refresh(); };

wireDrop("audioDrop", "audioInput", (f) => loadAudio(f).catch(fail));

/* ------------------------------------------------------------------ playback */

// One transport for both the song on its own and the song with the animation over it,
// so the two can never end up playing at once
let playback = null;

function startPlayback() {
  stopPlayback();
  actx.resume();

  const from = downbeat();
  const source = actx.createBufferSource();
  source.buffer = state.audioBuffer;
  source.connect(actx.destination);

  const t0 = actx.currentTime + 0.08;
  source.start(t0, from);
  source.onended = () => { if (playback?.source === source) stopPlayback(); };

  playback = { source, t0, from, clicks: [], nextClick: t0, raf: 0 };
  playback.raf = requestAnimationFrame(tickPlayback);
  syncTransport();
}

function stopPlayback() {
  if (!playback) return;
  cancelAnimationFrame(playback.raf);
  try { playback.source.stop(); } catch {}
  clearPendingClicks();
  playback = null;
  syncTransport();
  if (state.audioBuffer) drawWave();
  if (state.frames.length) drawFrame();
}

function tickPlayback() {
  const elapsed = actx.currentTime - playback.t0;

  if (elapsed >= 0) {
    drawWave(playback.from + elapsed);
    // currentTiming is read fresh every frame, so a tempo change lands immediately
    if (currentTiming) {
      const ms = elapsed * 1000;
      const inLoop = ms % currentTiming.loopMs;
      let i = currentTiming.onsets.findIndex((o) => o > inLoop) - 1;
      if (i < 0) i = currentTiming.durations.length - 1;

      const frame = currentTiming.order[i];
      const ctx = $("previewCanvas").getContext("2d");
      ctx.clearRect(0, 0, state.width, state.height);
      ctx.drawImage(state.frames[frame], 0, 0);
      $("previewPos").textContent =
        `${(ms / 1000).toFixed(2)}s · beat ${Math.floor(ms / currentTiming.msPerBeat) + 1} · frame ${frame}`;
    }
    pumpClicks();
  }

  playback.raf = requestAnimationFrame(tickPlayback);
}

function syncTransport() {
  $("previewBtn").textContent = playback ? "Stop" : "Play preview";
  $("tapBeatBtn").disabled = !playback;
}

$("previewBtn").onclick = () => (playback ? stopPlayback() : startPlayback());

// Tapping along while it plays is the quick way to get the beats down; clicking the
// waveform is the way to nudge one into exactly the right place afterwards
function tapBeat() {
  if (!playback) return;
  addAudioBeat(playback.from + Math.max(0, actx.currentTime - playback.t0));
}

$("tapBeatBtn").onclick = tapBeat;

/* -------------------------------------------------------------- click track */

// Scheduled a fraction of a second ahead rather than all at once, so changing the tempo
// mid-play can drop the clicks that have not sounded yet and re-lay them on the new grid
function pumpClicks() {
  if (!$("clickTrack").checked) return;

  const msPerBeat = getMsPerBeat();
  if (!msPerBeat) return;

  while (playback.nextClick < actx.currentTime + 0.4) {
    if (playback.nextClick > actx.currentTime) {
      const osc = actx.createOscillator(), gain = actx.createGain();
      osc.frequency.value = 1500;
      gain.gain.setValueAtTime(0.07, playback.nextClick);
      gain.gain.exponentialRampToValueAtTime(0.001, playback.nextClick + 0.04);
      osc.connect(gain).connect(actx.destination);
      osc.start(playback.nextClick);
      osc.stop(playback.nextClick + 0.05);
      playback.clicks.push({ osc, at: playback.nextClick });
    }
    playback.nextClick += msPerBeat / 1000;
  }

  playback.clicks = playback.clicks.filter((c) => c.at > actx.currentTime - 1);
}

function clearPendingClicks() {
  for (const c of playback.clicks) {
    if (c.at > actx.currentTime) { try { c.osc.stop(); } catch {} }
  }
  playback.clicks = playback.clicks.filter((c) => c.at <= actx.currentTime);
}

function retimeClicks() {
  clearPendingClicks();
  const msPerBeat = getMsPerBeat();
  if (!msPerBeat) return;

  const origin = playback.t0 + (downbeat() - playback.from);
  const step = msPerBeat / 1000;
  const passed = Math.max(0, Math.ceil((actx.currentTime + 0.05 - origin) / step));
  playback.nextClick = origin + passed * step;
}

/* --------------------------------------------------------------------- tempo */

let taps = [];
$("tapBtn").onclick = () => {
  const now = performance.now();
  if (taps.length && now - taps[taps.length - 1] > 2000) taps = [];
  taps.push(now);
  if (taps.length > 1) {
    const span = taps[taps.length - 1] - taps[0];
    $("bpm").value = (60000 / (span / (taps.length - 1))).toFixed(1);
    refresh();
  }
  $("tapBtn").textContent = taps.length > 1 ? `Tap (${taps.length})` : "Tap";
};

/* ------------------------------------------------------------ tempo estimate */

// TempoCNN's front end, matched against essentia's TensorflowInputTempoCNN: 11025Hz mono,
// 1024-sample frames every 512, Hann, magnitude spectrum, 40 Slaney mel bands over
// 20-5000Hz with unit-triangle normalisation. Reproduces essentia's mel matrix to 1.5e-7.
const TEMPO_SR = 11025, TEMPO_FRAME = 1024, TEMPO_HOP = 512, TEMPO_BANDS = 40, TEMPO_PATCH = 256;

const MEL_F_SP = 200 / 3, MEL_LOG_HZ = 1000;
const MEL_LOG_STEP = Math.log(6.4) / 27, MEL_LOG_MEL = MEL_LOG_HZ / MEL_F_SP;
const hzToMel = (f) => (f < MEL_LOG_HZ ? f / MEL_F_SP : MEL_LOG_MEL + Math.log(f / MEL_LOG_HZ) / MEL_LOG_STEP);
const melToHz = (m) => (m < MEL_LOG_MEL ? m * MEL_F_SP : MEL_LOG_HZ * Math.exp(MEL_LOG_STEP * (m - MEL_LOG_MEL)));

function melFilterbank(lo = 20, hi = 5000) {
  const bins = TEMPO_FRAME / 2 + 1;
  const loMel = hzToMel(lo), hiMel = hzToMel(hi);
  const edges = Array.from({ length: TEMPO_BANDS + 2 }, (_, i) =>
    melToHz(loMel + ((hiMel - loMel) * i) / (TEMPO_BANDS + 1)));

  return Array.from({ length: TEMPO_BANDS }, (_, b) => {
    const [l, c, r] = [edges[b], edges[b + 1], edges[b + 2]];
    const weights = [];
    let start = -1;
    for (let k = 0; k < bins; k++) {
      const f = (k * TEMPO_SR) / TEMPO_FRAME;
      // triangle, scaled so its area is one
      const v = Math.max(0, Math.min((f - l) / (c - l), (r - f) / (r - c))) * (2 / (r - l));
      if (v > 0) { if (start < 0) start = k; weights.push(v); }
      else if (start >= 0) break;
    }
    return { start, weights: Float64Array.from(weights) };
  });
}

function fft(re, im) {
  const n = re.length;
  for (let i = 1, j = 0; i < n; i++) {
    let bit = n >> 1;
    for (; j & bit; bit >>= 1) j ^= bit;
    j ^= bit;
    if (i < j) { [re[i], re[j]] = [re[j], re[i]]; [im[i], im[j]] = [im[j], im[i]]; }
  }
  for (let len = 2; len <= n; len <<= 1) {
    const ang = (-2 * Math.PI) / len;
    for (let i = 0; i < n; i += len) {
      for (let k = 0; k < len / 2; k++) {
        const wr = Math.cos(ang * k), wi = Math.sin(ang * k);
        const ur = re[i + k], ui = im[i + k];
        const vr = re[i + k + len / 2] * wr - im[i + k + len / 2] * wi;
        const vi = re[i + k + len / 2] * wi + im[i + k + len / 2] * wr;
        re[i + k] = ur + vr; im[i + k] = ui + vi;
        re[i + k + len / 2] = ur - vr; im[i + k + len / 2] = ui - vi;
      }
    }
  }
}

function melSpectrogram(samples) {
  const fb = melFilterbank();
  const bins = TEMPO_FRAME / 2 + 1;
  // denominator is size-1, which is the Hann essentia uses
  const window = Float64Array.from({ length: TEMPO_FRAME }, (_, i) =>
    0.5 - 0.5 * Math.cos((2 * Math.PI * i) / (TEMPO_FRAME - 1)));

  const rows = [];
  for (let at = 0; at + TEMPO_FRAME <= samples.length; at += TEMPO_HOP) {
    const re = new Float64Array(TEMPO_FRAME), im = new Float64Array(TEMPO_FRAME);
    for (let i = 0; i < TEMPO_FRAME; i++) re[i] = samples[at + i] * window[i];
    fft(re, im);

    const row = new Float64Array(TEMPO_BANDS);
    for (let b = 0; b < TEMPO_BANDS; b++) {
      const { start, weights } = fb[b];
      let acc = 0;
      for (let i = 0; i < weights.length; i++) acc += Math.hypot(re[start + i], im[start + i]) * weights[i];
      row[b] = acc;
    }
    rows.push(row);
  }
  return rows;
}

let tempoModel = null;

async function loadTempoModel() {
  if (tempoModel) return tempoModel;
  const tf = await import("https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/+esm");
  await tf.ready();
  return (tempoModel = { tf, model: await tf.loadGraphModel("tempocnn/model.json") });
}

async function estimateBpm(buffer) {
  const { tf, model } = await loadTempoModel();

  const offline = new OfflineAudioContext(1, Math.ceil(buffer.duration * TEMPO_SR), TEMPO_SR);
  const source = offline.createBufferSource();
  source.buffer = buffer;
  source.connect(offline.destination);
  source.start();
  const mel = melSpectrogram((await offline.startRendering()).getChannelData(0));

  if (mel.length < TEMPO_PATCH) {
    throw new Error(`Need about ${Math.ceil((TEMPO_PATCH * TEMPO_HOP) / TEMPO_SR)}s of audio to estimate the tempo.`);
  }

  // The model reads one 256-frame patch at a time; average the votes across the track
  const votes = new Float64Array(256);
  let patches = 0;
  for (let at = 0; at + TEMPO_PATCH <= mel.length; at += TEMPO_PATCH / 2) {
    const patch = new Float32Array(TEMPO_BANDS * TEMPO_PATCH);
    for (let t = 0; t < TEMPO_PATCH; t++) {
      for (let m = 0; m < TEMPO_BANDS; m++) patch[m * TEMPO_PATCH + t] = mel[at + t][m];
    }

    let mean = 0;
    for (const v of patch) mean += v;
    mean /= patch.length;
    let sd = 0;
    for (const v of patch) sd += (v - mean) ** 2;
    sd = Math.max(Math.sqrt(sd / patch.length), 1e-4);
    for (let i = 0; i < patch.length; i++) patch[i] = (patch[i] - mean) / sd;

    const input = tf.tensor(patch, [1, TEMPO_BANDS, TEMPO_PATCH, 1]);
    const output = model.execute(input);
    const probabilities = await output.data();
    for (let i = 0; i < 256; i++) votes[i] += probabilities[i];
    input.dispose();
    output.dispose();
    patches++;
  }

  let best = 0;
  for (let i = 1; i < 256; i++) if (votes[i] > votes[best]) best = i;
  // the softmax runs from 30 BPM up
  return { bpm: best + 30, confidence: votes[best] / patches, patches };
}

$("estimateBtn").onclick = async () => {
  const button = $("estimateBtn");
  if (!state.audioBuffer) return;

  button.disabled = true;
  button.textContent = "Estimating…";
  try {
    const { bpm, confidence, patches } = await estimateBpm(state.audioBuffer);
    $("bpm").value = bpm.toFixed(1);
    $("estimateNote").textContent =
      `${bpm} BPM from ${patches} window${patches > 1 ? "s" : ""}, confidence ${confidence.toFixed(2)}`;
    refresh();
  } catch (err) {
    $("estimateNote").textContent = err.message.includes("Failed to fetch")
      ? "Could not load the tempo model. It needs the page to be served, and a network connection the first time."
      : err.message;
  } finally {
    button.disabled = false;
    button.textContent = "Estimate";
  }
};

// BPM is the song's tempo; hits is how often the animation lands against it
function getMsPerBeat() {
  const bpm = parseFloat($("bpm").value), hits = parseFloat($("hits").value);
  if (!(bpm > 0) || !(hits > 0)) return null;
  return 60000 / (bpm * hits);
}

for (const id of ["bpm", "hits", "interpolation", "clickTrack"]) {
  $(id).oninput = refresh;
}

/* ------------------------------------------------------------------- timing */

let currentTiming = null;

function computeTiming() {
  const beats = [...state.beats].sort((a, b) => a - b);
  const msPerBeat = getMsPerBeat();
  if (!beats.length || !msPerBeat || !state.frames.length) return null;

  const durations = getDurations(beats, msPerBeat, state.frames.length, $("interpolation").value);

  // Cumulative onset of each frame within one loop, so a time maps to a frame by search
  const onsets = [0];
  for (const d of durations) onsets.push(onsets[onsets.length - 1] + d);

  return {
    beats, msPerBeat, durations, onsets,
    order: getFrameOrder(beats[0], state.frames.length),
    loopMs: beats.length * msPerBeat,
  };
}

function refresh() {
  const ready = { gif: state.frames.length > 0, audio: !!state.audioBuffer };

  $("framePos").textContent = ready.gif ? `frame ${state.cur} of ${state.frames.length - 1}` : "";
  $("markBtn").textContent = state.beats.has(state.cur) ? "Unmark beat (space)" : "Mark beat (space)";

  [...$("strip").children].forEach((c, i) => {
    c.classList.toggle("cur", i === state.cur);
    c.classList.toggle("beat", state.beats.has(i));
  });

  const beats = [...state.beats].sort((a, b) => a - b);
  $("beatList").innerHTML = beats.length
    ? `beat frames <b>${beats.join(" ")}</b>`
    : "no beat frames marked";

  currentTiming = null;
  let problem = "";
  try { currentTiming = computeTiming(); } catch (err) { problem = err.message; }

  if (ready.audio) {
    const marks = state.audioBeats.length;
    $("audioSummary").innerHTML = marks
      ? `<b>${marks}</b> beat mark${marks > 1 ? "s" : ""} · downbeat <b>${downbeat().toFixed(3)}s</b>`
      : "click the waveform to mark the beats of the song";
    drawWave(playback ? playback.from + Math.max(0, actx.currentTime - playback.t0) : null);
  }

  $("timingSummary").innerHTML = problem ? `<span class="warn">${problem}</span>` : "";
  if (currentTiming) {
    const short = currentTiming.durations.filter((d) => d < MIN_VISIBLE_MS).length;
    $("timingSummary").innerHTML =
      `beat <b>${currentTiming.msPerBeat.toFixed(1)}ms</b> · loop <b>${beats.length}</b> beats, ` +
      `<b>${(currentTiming.loopMs / 1000).toFixed(2)}s</b> · shortest frame ` +
      `<b>${Math.min(...currentTiming.durations).toFixed(1)}ms</b>` +
      (short ? `<br><span class="warn">${short} frame${short > 1 ? "s" : ""} shorter than one ` +
        `frame of a 60Hz display, so they will flash past rather than read.</span>` : "");
  }

  $("secSync").toggleAttribute("data-off", !ready.audio);
  $("previewCanvas").hidden = !ready.gif;
  syncTransport();
  $("secRender").toggleAttribute("data-off", !(currentTiming && ready.audio));

  // Tempo changes take effect on the running preview; moving the downbeat has to
  // restart it, since that is where the audio is playing from
  if (playback) {
    if (Math.abs(playback.from - downbeat()) > 1e-9) startPlayback();
    else retimeClicks();
  }

  return currentTiming;
}

/* --------------------------------------------------------------------- misc */

function log(line) {
  $("log").textContent += line + "\n";
  $("log").scrollTop = $("log").scrollHeight;
}

function fail(err) {
  console.error(err);
  log(`ERROR ${err.message}`);

/* --------------------------------------------------------------------- mp4 */
// A small MP4 writer. The point of writing one rather than pulling a library in is that
// the page stays a single file that works straight off the filesystem, and that the video
// track carries a per-sample duration, so the retimed frames keep exact microsecond
// timing instead of the 40ms grid the ffmpeg path is stuck with.

const MOVIE_TIMESCALE = 1000;
const VIDEO_TIMESCALE = 1000000;
const MATRIX = [0x00010000, 0, 0, 0, 0x00010000, 0, 0, 0, 0x40000000];

const bytes = (...v) => new Uint8Array(v);
const u16 = (n) => bytes((n >>> 8) & 255, n & 255);
const u24 = (n) => bytes((n >>> 16) & 255, (n >>> 8) & 255, n & 255);
const u32 = (n) => bytes((n >>> 24) & 255, (n >>> 16) & 255, (n >>> 8) & 255, n & 255);
const ascii = (s) => new Uint8Array([...s].map((c) => c.charCodeAt(0)));

function cat(parts) {
  const out = new Uint8Array(parts.reduce((n, p) => n + p.length, 0));
  let at = 0;
  for (const p of parts) { out.set(p, at); at += p.length; }
  return out;
}

const box = (type, ...parts) => {
  const payload = cat(parts);
  return cat([u32(payload.length + 8), ascii(type), payload]);
};
const fullBox = (type, version, flags, ...parts) => box(type, bytes(version), u24(flags), ...parts);

// One stts entry per run of equal deltas, which is what makes variable frame timing cheap
function sttsBox(deltas) {
  const runs = [];
  for (const d of deltas) {
    const last = runs[runs.length - 1];
    if (last && last[1] === d) last[0]++;
    else runs.push([1, d]);
  }
  return fullBox("stts", 0, 0, u32(runs.length), ...runs.map(([count, delta]) => cat([u32(count), u32(delta)])));
}

function descriptor(tag, payload) {
  if (payload.length > 127) throw new Error(`Descriptor ${tag} too long to write.`);
  return cat([bytes(tag, payload.length), payload]);
}

function trakBox(t) {
  const stbl = box("stbl",
    fullBox("stsd", 0, 0, u32(1), t.sampleEntry),
    sttsBox(t.deltas),
    ...(t.syncSamples ? [fullBox("stss", 0, 0, u32(t.syncSamples.length), ...t.syncSamples.map(u32))] : []),
    fullBox("stsc", 0, 0, u32(1), cat([u32(1), u32(t.sizes.length), u32(1)])),
    fullBox("stsz", 0, 0, u32(0), u32(t.sizes.length), ...t.sizes.map(u32)),
    fullBox("stco", 0, 0, u32(1), u32(t.chunkOffset)),
  );

  const tkhd = fullBox("tkhd", 0, 3,
    u32(0), u32(0), u32(t.id), u32(0), u32(t.movieDuration),
    u32(0), u32(0), u16(0), u16(0), u16(t.isVideo ? 0 : 0x0100), u16(0),
    ...MATRIX.map(u32),
    u32((t.isVideo ? t.width : 0) * 65536), u32((t.isVideo ? t.height : 0) * 65536),
  );

  const mdia = box("mdia",
    fullBox("mdhd", 0, 0, u32(0), u32(0), u32(t.timescale), u32(t.mediaDuration), u16(0x55c4), u16(0)),
    fullBox("hdlr", 0, 0, u32(0), ascii(t.isVideo ? "vide" : "soun"), u32(0), u32(0), u32(0),
      ascii(t.isVideo ? "VideoHandler" : "SoundHandler"), bytes(0)),
    box("minf",
      t.isVideo ? fullBox("vmhd", 0, 1, u16(0), u16(0), u16(0), u16(0)) : fullBox("smhd", 0, 0, u16(0), u16(0)),
      box("dinf", fullBox("dref", 0, 0, u32(1), fullBox("url ", 0, 1))),
      stbl,
    ),
  );

  const edts = t.priming
    ? [box("edts", fullBox("elst", 0, 0, u32(1),
        u32(Math.round(((t.mediaDuration - t.priming) / t.timescale) * MOVIE_TIMESCALE)),
        u32(t.priming), u16(1), u16(0)))]
    : [];

  return box("trak", tkhd, ...edts, mdia);
}

function avc1Entry(width, height, avcC) {
  return box("avc1",
    bytes(0, 0, 0, 0, 0, 0), u16(1),
    u16(0), u16(0), u32(0), u32(0), u32(0),
    u16(width), u16(height),
    u32(0x00480000), u32(0x00480000), u32(0),
    u16(1), new Uint8Array(32),
    u16(0x0018), u16(0xffff),
    box("avcC", avcC),
  );
}

function mp4aEntry(channels, sampleRate, audioSpecificConfig) {
  const esds = fullBox("esds", 0, 0, descriptor(0x03, cat([
    u16(1), bytes(0),
    descriptor(0x04, cat([
      bytes(0x40, 0x15), u24(0), u32(0), u32(0),
      descriptor(0x05, audioSpecificConfig),
    ])),
    descriptor(0x06, bytes(0x02)),
  ])));

  return box("mp4a",
    bytes(0, 0, 0, 0, 0, 0), u16(1),
    u32(0), u32(0),
    u16(channels), u16(16), u16(0), u16(0),
    u32(sampleRate * 65536),
    esds,
  );
}

// Opus in MP4 carries its config in a dOps box instead of an esds descriptor
function opusEntry(channels, preSkip) {
  return box("Opus",
    bytes(0, 0, 0, 0, 0, 0), u16(1),
    u32(0), u32(0),
    u16(channels), u16(16), u16(0), u16(0),
    u32(48000 * 65536),
    box("dOps", bytes(0), bytes(channels), u16(preSkip), u32(48000), u16(0), bytes(0)),
  );
}

function buildMp4(video, audio) {
  const videoBytes = video.samples.reduce((n, s) => n + s.data.length, 0);
  const audioBytes = audio.samples.reduce((n, s) => n + s.data.length, 0);

  const ftyp = box("ftyp", ascii("isom"), u32(0x200), ascii("isom"), ascii("iso2"), ascii("avc1"), ascii("mp41"));
  const mdatStart = ftyp.length;

  const videoMs = Math.round((video.durationTs / VIDEO_TIMESCALE) * MOVIE_TIMESCALE);
  const audioMs = Math.round((audio.durationTs / audio.sampleRate) * MOVIE_TIMESCALE);

  const mvhd = fullBox("mvhd", 0, 0,
    u32(0), u32(0), u32(MOVIE_TIMESCALE), u32(Math.max(videoMs, audioMs)),
    u32(0x00010000), u16(0x0100), u16(0), u32(0), u32(0),
    ...MATRIX.map(u32), ...Array(6).fill(u32(0)), u32(3),
  );

  const moov = box("moov", mvhd,
    trakBox({
      id: 1, isVideo: true, timescale: VIDEO_TIMESCALE,
      mediaDuration: video.durationTs, movieDuration: videoMs,
      width: video.width, height: video.height,
      sampleEntry: avc1Entry(video.width, video.height, video.description),
      deltas: video.samples.map((s) => s.durationTs),
      sizes: video.samples.map((s) => s.data.length),
      syncSamples: video.samples.map((s, i) => (s.isKey ? i + 1 : 0)).filter(Boolean),
      chunkOffset: mdatStart + 8,
    }),
    trakBox({
      id: 2, isVideo: false, timescale: audio.sampleRate,
      mediaDuration: audio.durationTs, movieDuration: audioMs,
      sampleEntry: audio.codec === "opus"
        ? opusEntry(audio.channels, audio.preSkip)
        : mp4aEntry(audio.channels, audio.sampleRate, audio.description),
      priming: audio.priming,
      deltas: audio.samples.map((s) => s.durationTs),
      sizes: audio.samples.map((s) => s.data.length),
      chunkOffset: mdatStart + 8 + videoBytes,
    }),
  );

  return new Blob([
    ftyp,
    u32(8 + videoBytes + audioBytes), ascii("mdat"),
    ...video.samples.map((s) => s.data),
    ...audio.samples.map((s) => s.data),
    moov,
  ], { type: "video/mp4" });
}

/* ----------------------------------------------------------------- encoding */

// Which frame of the gif to show at which microsecond, repeated until the song runs out
function buildSchedule(timing, seconds) {
  const totalMs = seconds * 1000;
  const schedule = [];
  let cumMs = 0;

  while (cumMs < totalMs) {
    for (let i = 0; i < timing.order.length && cumMs < totalMs; i++) {
      // Timestamps come from the running total rather than the rounded frame durations,
      // so rounding cannot accumulate and walk the beats off the grid
      schedule.push({ frame: timing.order[i], tsUs: Math.round(cumMs * 1000) });
      cumMs += timing.durations[i];
    }
  }

  const endUs = Math.round(Math.min(cumMs, totalMs) * 1000);
  return schedule.map((s, i) => ({
    ...s,
    durationUs: (i + 1 < schedule.length ? schedule[i + 1].tsUs : endUs) - s.tsUs,
  })).filter((s) => s.durationUs > 0);
}

// Firefox ships no AAC encoder, so fall back to Opus. Both are legal in MP4, but an
// Opus track will not play in QuickTime or Safari, which is worth saying out loud.
let audioCodecChoice = null;

async function pickAudioCodec() {
  if (audioCodecChoice) return audioCodecChoice;

  for (const codec of ["mp4a.40.2", "opus"]) {
    const { supported } = await AudioEncoder.isConfigSupported({
      codec, sampleRate: 48000, numberOfChannels: 2, bitrate: 160000,
    });
    if (supported) return (audioCodecChoice = codec);
  }
  throw new Error("This browser has neither an AAC nor an Opus encoder.");
}

async function pickVideoCodec(width, height) {
  for (const codec of ["avc1.42002a", "avc1.4d0034", "avc1.640034"]) {
    const { supported } = await VideoEncoder.isConfigSupported({
      codec, width, height, bitrate: 4e6, framerate: 30, avc: { format: "avc" },
    });
    if (supported) return codec;
  }
  throw new Error("No supported H.264 encoder configuration in this browser.");
}

async function encodeVideo(schedule, width, height) {
  const samples = [];
  let description = null;

  // A throw from inside a WebCodecs error callback goes nowhere, so hold onto it and
  // re-raise it here: without this a failed configure() only shows up much later as
  // "Encoder must be configured first", which says nothing about the real cause
  let failure = null;
  const encoder = new VideoEncoder({
    output: (chunk, meta) => {
      if (meta?.decoderConfig?.description && !description) {
        description = new Uint8Array(meta.decoderConfig.description);
      }
      const data = new Uint8Array(chunk.byteLength);
      chunk.copyTo(data);
      samples.push({ data, tsUs: chunk.timestamp, isKey: chunk.type === "key" });
    },
    error: (e) => { failure ??= e; },
  });

  encoder.configure({
    codec: await pickVideoCodec(width, height),
    width, height, bitrate: 4e6, framerate: 30, avc: { format: "avc" },
  });

  const canvas = new OffscreenCanvas(width, height);
  const ctx = canvas.getContext("2d");
  let lastKeyUs = -Infinity;

  for (let i = 0; i < schedule.length; i++) {
    const { frame, tsUs, durationUs } = schedule[i];

    ctx.clearRect(0, 0, width, height);
    ctx.drawImage(state.frames[frame], 0, 0);

    const keyFrame = tsUs - lastKeyUs >= 2e6;
    if (keyFrame) lastKeyUs = tsUs;

    const videoFrame = new VideoFrame(canvas, { timestamp: tsUs, duration: durationUs });
    encoder.encode(videoFrame, { keyFrame });
    videoFrame.close();

    if (encoder.encodeQueueSize > 24) {
      await new Promise((r) => { encoder.ondequeue = r; });
    }
    if (i % 200 === 0) log(`  video ${i}/${schedule.length} frames`);
    if (failure) throw failure;
  }

  await encoder.flush().catch((e) => { failure ??= e; });
  if (failure) throw failure;
  encoder.close();

  if (!description) throw new Error("The encoder produced no avcC description.");

  // Encoders may reorder output, and the muxer needs the samples in decode order
  samples.sort((a, b) => a.tsUs - b.tsUs);
  const endUs = schedule[schedule.length - 1].tsUs + schedule[schedule.length - 1].durationUs;

  return {
    width, height, description, durationTs: endUs,
    samples: samples.map((s, i) => ({
      data: s.data, isKey: s.isKey,
      durationTs: (i + 1 < samples.length ? samples[i + 1].tsUs : endUs) - s.tsUs,
    })),
  };
}

// An AAC encoder emits a couple of thousand samples of priming before the real audio
// starts. How many depends on the platform's encoder, so measure it by round-tripping a
// noise burst rather than assuming. Left uncorrected it drags the music tens of
// milliseconds behind the animation, which on a 500ms beat is plainly audible.
async function measureEncoderDelay(codec, sampleRate, channels) {
  const LENGTH = 8192, SEARCH = 8192;

  const probe = new Float32Array(LENGTH);
  let seed = 1;
  for (let i = 0; i < LENGTH; i++) {
    seed = (seed * 1103515245 + 12345) & 0x7fffffff;
    probe[i] = seed / 0x40000000 - 1;
  }

  const config = { codec, sampleRate, numberOfChannels: channels, bitrate: 160000 };
  const chunks = [];
  let description = null, failure = null;

  const encoder = new AudioEncoder({
    output: (chunk, meta) => {
      if (meta?.decoderConfig?.description && !description) {
        description = new Uint8Array(meta.decoderConfig.description);
      }
      chunks.push(chunk);
    },
    error: (e) => { failure ??= e; },
  });
  encoder.configure(config);

  for (let off = 0; off < LENGTH + SEARCH; off += 1024) {
    const planar = new Float32Array(1024 * channels);
    for (let c = 0; c < channels; c++) {
      for (let i = 0; i < 1024 && off + i < LENGTH; i++) planar[c * 1024 + i] = probe[off + i];
    }
    encoder.encode(new AudioData({
      format: "f32-planar", sampleRate, numberOfFrames: 1024, numberOfChannels: channels,
      timestamp: Math.round((off / sampleRate) * 1e6), data: planar,
    }));
  }
  await encoder.flush().catch((e) => { failure ??= e; });
  if (failure) throw failure;
  encoder.close();

  const decoded = [];
  const decoder = new AudioDecoder({
    output: (data) => {
      const plane = new Float32Array(data.numberOfFrames);
      data.copyTo(plane, { planeIndex: 0, format: "f32-planar" });
      decoded.push(plane);
      data.close();
    },
    error: (e) => { failure ??= e; },
  });
  decoder.configure(description ? { ...config, description } : config);
  for (const chunk of chunks) decoder.decode(chunk);
  await decoder.flush().catch((e) => { failure ??= e; });
  if (failure) throw failure;
  decoder.close();

  const flat = new Float32Array(decoded.reduce((n, p) => n + p.length, 0));
  decoded.reduce((at, p) => (flat.set(p, at), at + p.length), 0);

  // The lag that lines the decoded burst back up with the probe is the priming length
  let best = 0, bestScore = -Infinity;
  for (let lag = 0; lag + LENGTH <= flat.length && lag < SEARCH; lag++) {
    let score = 0;
    for (let i = 0; i < LENGTH; i += 4) score += probe[i] * flat[lag + i];
    if (score > bestScore) { bestScore = score; best = lag; }
  }
  return best;
}

async function encodeAudio(seconds) {
  const buffer = state.audioBuffer;
  const sampleRate = buffer.sampleRate;
  const channels = Math.min(2, buffer.numberOfChannels);
  const start = Math.round(downbeat() * sampleRate);
  const total = Math.min(buffer.length - start, Math.round(seconds * sampleRate));

  const codec = await pickAudioCodec();
  const samples = [];
  let description = null, failure = null;

  const encoder = new AudioEncoder({
    output: (chunk, meta) => {
      if (meta?.decoderConfig?.description && !description) {
        description = new Uint8Array(meta.decoderConfig.description);
      }
      const data = new Uint8Array(chunk.byteLength);
      chunk.copyTo(data);
      samples.push({ data, durationTs: Math.round((chunk.duration / 1e6) * sampleRate) || 1024 });
    },
    error: (e) => { failure ??= e; },
  });

  encoder.configure({ codec, sampleRate, numberOfChannels: channels, bitrate: 160000 });

  const BLOCK = 1024;
  for (let off = 0; off < total; off += BLOCK) {
    const n = Math.min(BLOCK, total - off);
    const planar = new Float32Array(n * channels);
    for (let c = 0; c < channels; c++) {
      planar.set(buffer.getChannelData(c).subarray(start + off, start + off + n), c * n);
    }
    encoder.encode(new AudioData({
      format: "f32-planar", sampleRate, numberOfFrames: n, numberOfChannels: channels,
      timestamp: Math.round((off / sampleRate) * 1e6), data: planar,
    }));
    if (encoder.encodeQueueSize > 24) await new Promise((r) => { encoder.ondequeue = r; });
    if (failure) throw failure;
  }

  await encoder.flush().catch((e) => { failure ??= e; });
  if (failure) throw failure;
  encoder.close();

  // AAC needs its AudioSpecificConfig to be decodable; Opus describes itself in dOps
  if (codec !== "opus" && !description) {
    throw new Error("The encoder produced no AudioSpecificConfig.");
  }

  // Opus states its own pre-skip in the OpusHead the encoder hands back, and a decoder
  // applies it, so a round trip cannot see it — read it out instead of measuring. AAC
  // says nothing about its priming, so that one has to be measured and cut with an edit list.
  const preSkip = codec === "opus"
    ? readOpusPreSkip(description)
    : await measureEncoderDelay(codec, sampleRate, channels);

  return {
    codec, sampleRate, channels, description, samples, preSkip,
    priming: codec === "opus" ? 0 : preSkip,
    durationTs: samples.reduce((n, s) => n + s.durationTs, 0),
  };
}

function readOpusPreSkip(description) {
  const head = description && String.fromCharCode(...description.slice(0, 8));
  if (head !== "OpusHead") throw new Error("The Opus encoder returned no OpusHead.");
  return description[10] | (description[11] << 8);
}

function offerDownload(blob, filename) {
  const link = $("download");
  if (link.href) URL.revokeObjectURL(link.href);
  link.href = URL.createObjectURL(blob);
  link.download = filename;
  link.textContent = `Download ${filename} (${(blob.size / 1e6).toFixed(1)}MB)`;
  link.hidden = false;
}

function outputName() {
  const stem = (f) => f.name.replace(/\.[^.]+$/, "");
  return `${stem(state.audioFile)}_${stem(state.gifFile)}.mp4`;
}

$("renderBrowserBtn").onclick = async () => {
  const button = $("renderBrowserBtn");
  const timing = computeTiming();
  if (!timing) return;

  button.disabled = true;
  $("log").textContent = "";
  $("download").hidden = true;

  try {
    const seconds = state.audioBuffer.duration - downbeat();
    // H.264 needs even dimensions; an odd gif gets one transparent row or column
    const width = state.width + (state.width % 2);
    const height = state.height + (state.height % 2);

    const schedule = buildSchedule(timing, seconds);
    log(`Rendering ${schedule.length} frames over ${seconds.toFixed(2)}s at ${width}×${height}`);

    const video = await encodeVideo(schedule, width, height);
    log(`  video done, ${video.samples.length} samples`);

    const audio = await encodeAudio(seconds);
    log(`  audio done, ${audio.codec}, ${audio.samples.length} samples, ` +
        `${audio.preSkip} samples of encoder priming skipped`);

    offerDownload(buildMp4(video, audio), outputName());
    log("Done.");
  } catch (err) {
    fail(err);
  } finally {
    button.disabled = false;
  }
};

// Say up front if this browser will produce an Opus track, rather than after a render
if ("AudioEncoder" in window) {
  pickAudioCodec().then((codec) => {
    if (codec === "opus") {
      $("codecNote").textContent =
        "No AAC encoder in this browser, so the audio will be Opus. The mp4 plays in " +
        "Chrome, Firefox and VLC, but not QuickTime or Safari. Chrome or Safari will give you AAC.";
    }
  }).catch((err) => { $("codecNote").textContent = err.message; });
}

addEventListener("resize", () => { if (state.audioBuffer) refresh(); });
refresh();
</script>
</body>
</html>
